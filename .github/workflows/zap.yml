# PromptComplet — scan dynamique OWASP ZAP (baseline, non intrusif) d'une URL de PRÉPRODUCTION.
# Lancement manuel uniquement (onglet Actions > Scan dynamique > Run workflow).
# Ne jamais scanner un site qui n'appartient pas à la personne. Fichier PROTÉGÉ.
name: Scan dynamique (ZAP)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL de préproduction à analyser (un site qui t'appartient)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.url }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: rapport-zap
