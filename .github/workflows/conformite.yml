# PromptComplet — vérification de conformité (légal, données, accessibilité, intégrité de la méthode).
# Fichier PROTÉGÉ : l'IA ne le modifie pas. Sur un tag (version publiée) : mode lancement strict.
name: Conformité

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformite:
    name: Conformité PromptComplet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vérification de conformité
        env:
          # Sur un tag (version publiée) : mode lancement strict. Passé par variable (pas d'injection dans le shell).
          MODE: ${{ startsWith(github.ref, 'refs/tags/') && '--release' || '' }}
        run: node promptcomplet/scripts/verifier-conformite.mjs --ci $MODE
