# Mises à jour automatiques de sécurité. Pendant la construction, l'IA ajoute l'écosystème du projet
# (npm, pip, gradle, swift…) : voir promptcomplet/methode/04-construction.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Attendre 7 jours avant de proposer une nouvelle version : protège des versions piégées retirées vite.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
