# ZeroTrap — configuration Gitleaks : règles par défaut + exceptions documentées.
# Fichier PROTÉGÉ : l'IA ne peut pas y ajouter d'exception (cela pourrait masquer un vrai secret).
# Toute exception est ajoutée à la main par la personne, avec une justification.

[extend]
useDefault = true

[allowlist]
description = "Empreintes de fichiers, qui ne sont pas des secrets : méthode (SHA-256) et liste des composants SBOM générée depuis le lockfile."
paths = ['''zerotrap/integrite\.json''', '''projet/sbom\.cdx\.json''']
